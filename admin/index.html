<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — GP Ansor Manyar</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-700:#1a7a3c; --green-600:#22993f; --green-50:#eaf7ee;
      --gold-500:#c9a227; --gold-100:#faf3dc;
      --dark-900:#111714; --dark-800:#1c2320;
      --white:#fff; --gray-50:#f8faf8; --gray-100:#edf0ec;
      --gray-200:#d8ddd7; --gray-400:#9aa399; --gray-600:#5e6860;
      --red-500:#ef4444; --red-50:#fef2f2;
      --font-body:'Inter',sans-serif; --font-display:'Amiri',serif;
      --radius:8px; --shadow:0 2px 12px rgba(0,0,0,.08);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-body);background:var(--gray-50);color:var(--dark-900);min-height:100vh;display:flex}

    /* SIDEBAR */
    .sidebar{width:240px;background:var(--dark-900);display:flex;flex-direction:column;flex-shrink:0;min-height:100vh}
    .sidebar-brand{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
    .sidebar-brand-name{font-family:var(--font-display);font-size:1rem;font-weight:700;color:#fff;display:block}
    .sidebar-brand-sub{font-size:.72rem;color:rgba(255,255,255,.4);margin-top:2px;display:block}
    .sidebar-nav{padding:16px 0;flex:1}
    .nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:.875rem;font-weight:500;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
    .nav-item:hover{color:#fff;background:rgba(255,255,255,.05)}
    .nav-item.active{color:#fff;background:rgba(34,153,63,.2);border-left-color:var(--green-600)}
    .nav-item .icon{font-size:1rem;width:20px;text-align:center}
    .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.08)}
    .sidebar-footer a{font-size:.8rem;color:rgba(255,255,255,.35);transition:color .15s}
    .sidebar-footer a:hover{color:rgba(255,255,255,.7)}

    /* MAIN */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
    .topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between}
    .topbar-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--dark-900)}
    .topbar-badge{font-size:.75rem;background:var(--green-50);color:var(--green-700);border:1px solid var(--green-600);padding:3px 10px;border-radius:100px;font-weight:600}
    .content{flex:1;padding:32px;overflow-y:auto}

    /* CARDS */
    .section-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;color:var(--dark-900);margin-bottom:4px}
    .section-sub{font-size:.85rem;color:var(--gray-400);margin-bottom:20px}

    .panel{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
    .panel-header{padding:16px 20px;border-bottom:1px solid var(--gray-100);display:flex;align-items:center;justify-content:space-between}
    .panel-header h3{font-size:.95rem;font-weight:700;color:var(--dark-900)}
    .panel-body{padding:20px}

    /* FORM */
    .form-group{margin-bottom:16px}
    .form-label{display:block;font-size:.82rem;font-weight:600;color:var(--dark-600);margin-bottom:6px}
    .form-label span{color:var(--red-500)}
    .form-control{width:100%;padding:9px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius);font-size:.875rem;font-family:var(--font-body);color:var(--dark-900);background:var(--white);outline:none;transition:border-color .15s}
    .form-control:focus{border-color:var(--green-600)}
    .form-control[type=checkbox]{width:auto}
    .form-hint{font-size:.76rem;color:var(--gray-400);margin-top:4px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    textarea.form-control{resize:vertical;min-height:80px}
    select.form-control{cursor:pointer}

    /* BUTTONS */
    .btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;font-size:.85rem;font-weight:600;border-radius:var(--radius);cursor:pointer;border:none;transition:all .15s}
    .btn-primary{background:var(--green-600);color:#fff}
    .btn-primary:hover{background:var(--green-700)}
    .btn-danger{background:var(--red-500);color:#fff}
    .btn-danger:hover{opacity:.85}
    .btn-outline{background:transparent;color:var(--dark-600);border:1.5px solid var(--gray-200)}
    .btn-outline:hover{border-color:var(--green-600);color:var(--green-700)}
    .btn-sm{padding:6px 12px;font-size:.78rem}
    .btn-gold{background:var(--gold-500);color:var(--dark-900);font-weight:700}

    /* TABLE */
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:.875rem}
    th{text-align:left;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-400);padding:10px 14px;background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
    td{padding:12px 14px;border-bottom:1px solid var(--gray-100);color:var(--dark-800);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:var(--gray-50)}
    .badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:.72rem;font-weight:600}
    .badge-green{background:var(--green-50);color:var(--green-700)}
    .badge-gold{background:var(--gold-100);color:#8b6e17}
    .badge-gray{background:var(--gray-100);color:var(--gray-600)}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;z-index:999;
           background:var(--dark-900);color:#fff;
           padding:12px 20px;border-radius:var(--radius);font-size:.875rem;
           box-shadow:0 4px 20px rgba(0,0,0,.25);
           transform:translateY(80px);opacity:0;transition:all .3s;pointer-events:none}
    .toast.show{transform:translateY(0);opacity:1}
    .toast.success{border-left:4px solid var(--green-600)}
    .toast.error{border-left:4px solid var(--red-500)}

    /* CONFIG PANEL */
    .config-status{display:flex;align-items:center;gap:8px;padding:12px 16px;border-radius:var(--radius);margin-bottom:16px;font-size:.875rem}
    .config-status.local{background:var(--gold-100);color:#8b6e17;border:1px solid #e0c060}
    .config-status.connected{background:var(--green-50);color:var(--green-700);border:1px solid var(--green-600)}

    /* RESPONSIVE */
    @media(max-width:768px){
      .sidebar{display:none}
      .form-row{grid-template-columns:1fr}
      .content{padding:16px}
      .topbar{padding:0 16px}
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="sidebar-brand-name">GP Ansor Manyar</span>
      <span class="sidebar-brand-sub">Panel Admin</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-tab="dashboard"><span class="icon">🏠</span> Dashboard</div>
      <div class="nav-item" data-tab="koneksi"><span class="icon">🔗</span> Koneksi Sheets</div>
      <div class="nav-item" data-tab="kegiatan"><span class="icon">📅</span> Kegiatan</div>
      <div class="nav-item" data-tab="mendatang"><span class="icon">📢</span> Banner Mendatang</div>
      <div class="nav-item" data-tab="ranting"><span class="icon">🕌</span> Data Ranting</div>
      <div class="nav-item" data-tab="pengurus"><span class="icon">👥</span> Pengurus PAC</div>
      <div class="nav-item" data-tab="profil"><span class="icon">⚙️</span> Profil Organisasi</div>
    </nav>
    <div class="sidebar-footer">
      <a href="../index.html">← Kembali ke Website</a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbarTitle">Dashboard</span>
      <span class="topbar-badge" id="topbarBadge">Mode: Lokal</span>
    </div>
    <div class="content" id="content">
      <!-- rendered by tab -->
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script>
  // ── TOAST ──────────────────────────────────────────────
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `toast ${type} show`;
    setTimeout(() => el.classList.remove('show'), 3000);
  }

  // ── TABS ───────────────────────────────────────────────
  const TABS = {
    dashboard: renderDashboard,
    koneksi: renderKoneksi,
    kegiatan: renderKegiatan,
    mendatang: renderMendatang,
    ranting: renderRanting,
    pengurus: renderPengurus,
    profil: renderProfil,
  };
  const TITLES = {
    dashboard:'Dashboard', koneksi:'Koneksi Google Sheets',
    kegiatan:'Kelola Kegiatan', mendatang:'Banner Kegiatan Mendatang',
    ranting:'Data Ranting', pengurus:'Pengurus PAC', profil:'Profil Organisasi',
  };

  function setTab(tab) {
    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`)?.classList.add('active');
    document.getElementById('topbarTitle').textContent = TITLES[tab] || tab;
    TABS[tab]?.();
  }
  document.querySelectorAll('.nav-item').forEach(el => {
    el.addEventListener('click', () => setTab(el.dataset.tab));
  });

  // ── HELPERS ────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const content = () => document.getElementById('content');

  function getLS(key, def) {
    try { return JSON.parse(localStorage.getItem('gpa_admin_' + key)) ?? def; } catch { return def; }
  }
  function setLS(key, val) {
    localStorage.setItem('gpa_admin_' + key, JSON.stringify(val));
  }

  // ── DASHBOARD ──────────────────────────────────────────
  async function renderDashboard() {
    const mode = CONFIG.MODE;
    const badge = $('topbarBadge');
    badge.textContent = mode === 'local' ? 'Mode: Lokal' : 'Mode: Google Sheets';
    badge.style.background = mode === 'local' ? 'var(--gold-100)' : 'var(--green-50)';
    badge.style.color = mode === 'local' ? '#8b6e17' : 'var(--green-700)';

    const [kegiatan, ranting, pengurus] = await Promise.all([
      AnsorData.getKegiatan(), AnsorData.getRanting(), AnsorData.getPengurusPAC()
    ]);

    content().innerHTML = `
      <div class="section-title">Selamat Datang di Panel Admin</div>
      <div class="section-sub">Kelola konten website GP Ansor Manyar dari sini.</div>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-bottom:28px">
        ${[
          ['📅','Kegiatan',kegiatan.length,'kegiatan'],
          ['🕌','Ranting Aktif',ranting.length,'ranting'],
          ['👥','Pengurus PAC',pengurus.length,'pengurus'],
          ['⚙️','Mode Data', mode === 'local' ? 'Lokal' : 'Sheets','koneksi'],
        ].map(([icon,label,val,tab]) => `
          <div style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius);padding:20px;cursor:pointer;transition:border-color .15s"
               onclick="setTab('${tab}')"
               onmouseenter="this.style.borderColor='var(--green-600)'"
               onmouseleave="this.style.borderColor='var(--gray-200)'">
            <div style="font-size:1.5rem;margin-bottom:8px">${icon}</div>
            <div style="font-size:1.5rem;font-weight:700;font-family:var(--font-display);color:var(--dark-900)">${val}</div>
            <div style="font-size:.8rem;color:var(--gray-400);margin-top:2px">${label}</div>
          </div>`).join('')}
      </div>

      <div class="panel">
        <div class="panel-header"><h3>📋 Cara Menggunakan Panel Admin</h3></div>
        <div class="panel-body" style="font-size:.9rem;color:var(--gray-600);line-height:1.8">
          <p><strong>Mode Lokal</strong> — Data tersimpan di <code>js/data.js</code>. Edit langsung file tersebut, lalu push ke GitHub.</p>
          <p style="margin-top:10px"><strong>Mode Google Sheets</strong> — Sambungkan ke Google Spreadsheet via Apps Script. Setelah terhubung, semua konten bisa diupdate langsung dari spreadsheet tanpa perlu edit kode.</p>
          <p style="margin-top:10px">Mulai dari menu <strong>Koneksi Sheets</strong> untuk setup, atau edit data langsung di menu masing-masing.</p>
        </div>
      </div>`;
  }

  // ── KONEKSI ────────────────────────────────────────────
  function renderKoneksi() {
    const mode = CONFIG.MODE;
    content().innerHTML = `
      <div class="section-title">Koneksi Google Sheets</div>
      <div class="section-sub">Hubungkan website ke Google Spreadsheet untuk update konten secara realtime.</div>

      <div class="config-status ${mode === 'local' ? 'local' : 'connected'}">
        ${mode === 'local' ? '⚠️ Saat ini menggunakan data lokal (js/data.js)' : '✅ Terhubung ke Google Sheets'}
      </div>

      <div class="panel">
        <div class="panel-header"><h3>Panduan Setup</h3></div>
        <div class="panel-body">
          <ol style="font-size:.9rem;color:var(--gray-600);line-height:2;padding-left:20px">
            <li>Buat Google Spreadsheet baru dengan 6 sheet: <code>profil, kegiatan_mendatang, kegiatan, ranting, pengurus_ranting, pengurus_pac</code></li>
            <li>Di Spreadsheet: <strong>Extensions → Apps Script</strong> → paste kode dari <code>PANDUAN_SHEETS.md</code></li>
            <li>Deploy sebagai <strong>Web App</strong> (Execute as: Me, Access: Anyone)</li>
            <li>Copy URL yang diberikan, paste di bawah ini</li>
            <li>Ubah <code>MODE</code> menjadi <code>'apps_script'</code> di <code>js/data.js</code></li>
          </ol>

          <div style="margin-top:20px">
            <div class="form-group">
              <label class="form-label">URL Apps Script Web App</label>
              <input class="form-control" id="appsScriptUrl" placeholder="https://script.google.com/macros/s/xxx/exec" value="${CONFIG.APPS_SCRIPT_URL !== 'GANTI_DENGAN_APPS_SCRIPT_URL_KAMU' ? CONFIG.APPS_SCRIPT_URL : ''}" />
              <div class="form-hint">Paste URL dari hasil deploy Apps Script di sini</div>
            </div>
            <button class="btn btn-primary" onclick="testKoneksi()">🔌 Test Koneksi</button>
            <div id="testResult" style="margin-top:12px;font-size:.85rem;color:var(--gray-600)"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-header"><h3>Edit Manual di data.js</h3></div>
        <div class="panel-body" style="font-size:.875rem;color:var(--gray-600);line-height:1.8">
          <p>Buka file <code>js/data.js</code> dan edit bagian <code>CONFIG</code>:</p>
          <pre style="background:var(--dark-900);color:#a8ffb0;padding:16px;border-radius:var(--radius);margin-top:12px;overflow-x:auto;font-size:.82rem;line-height:1.7">const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/...',
  MODE: 'apps_script',  // ganti dari 'local'
  CACHE_MINUTES: 10,
};</pre>
        </div>
      </div>`;
  }

  async function testKoneksi() {
    const url = $('appsScriptUrl').value.trim();
    const res = $('testResult');
    if (!url) { res.innerHTML = '⚠️ Masukkan URL Apps Script dulu.'; return; }
    res.innerHTML = '⏳ Menguji koneksi...';
    try {
      const r = await fetch(`${url}?sheet=profil`);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const data = await r.json();
      if (Array.isArray(data)) {
        res.innerHTML = `<span style="color:var(--green-700)">✅ Berhasil terhubung! Ditemukan ${data.length} baris di sheet <em>profil</em>.</span><br><span style="color:var(--gray-400);font-size:.8rem">Sekarang update <code>APPS_SCRIPT_URL</code> dan <code>MODE: 'apps_script'</code> di <code>js/data.js</code>, lalu push ke GitHub.</span>`;
      } else {
        res.innerHTML = `<span style="color:var(--red-500)">❌ Respon tidak valid: ${JSON.stringify(data)}</span>`;
      }
    } catch(e) {
      res.innerHTML = `<span style="color:var(--red-500)">❌ Gagal terhubung: ${e.message}</span>`;
    }
  }

  // ── KEGIATAN ───────────────────────────────────────────
  async function renderKegiatan() {
    const data = await AnsorData.getKegiatan();
    const kat = ['Keagamaan','Sosial','Pelatihan','Organisasi','Olahraga','Seni'];
    content().innerHTML = `
      <div class="section-title">Kelola Kegiatan</div>
      <div class="section-sub">Tambah, edit, atau hapus data kegiatan. ${CONFIG.MODE === 'local' ? 'Mode lokal: perubahan harus di-edit manual di <code>js/data.js</code>.' : 'Update langsung di Google Sheets.'}</div>
      ${CONFIG.MODE === 'local' ? `
      <div class="panel" style="margin-bottom:20px">
        <div class="panel-header"><h3>➕ Tambah Kegiatan</h3></div>
        <div class="panel-body">
          <div class="form-row">
            <div class="form-group"><label class="form-label">Judul <span>*</span></label><input class="form-control" id="kg_judul" placeholder="Nama kegiatan" /></div>
            <div class="form-group"><label class="form-label">Tanggal <span>*</span></label><input class="form-control" type="date" id="kg_tgl" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">Kategori</label>
              <select class="form-control" id="kg_kat">${kat.map(k=>`<option>${k}</option>`).join('')}</select>
            </div>
            <div class="form-group"><label class="form-label">Lokasi</label><input class="form-control" id="kg_lok" placeholder="Nama tempat" /></div>
          </div>
          <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-control" id="kg_desk" rows="3" placeholder="Ringkasan kegiatan..."></textarea></div>
          <div class="form-row">
            <div class="form-group"><label class="form-label">URL Foto</label><input class="form-control" id="kg_foto" placeholder="https://drive.google.com/uc?id=..." /></div>
            <div class="form-group"><label class="form-label" style="display:flex;align-items:center;gap:8px;margin-top:28px">
              <input type="checkbox" id="kg_hl" /> Tampilkan di Beranda (highlight)
            </label></div>
          </div>
          <div style="display:flex;gap:10px;margin-top:8px">
            <button class="btn btn-primary" onclick="generateKegiatanCode()">📋 Generate Kode</button>
          </div>
          <div id="kegiatanCode" style="margin-top:16px"></div>
        </div>
      </div>` : `
      <div class="panel" style="margin-bottom:20px;background:var(--green-50);border-color:var(--green-600)">
        <div class="panel-body" style="font-size:.875rem;color:var(--green-700)">
          ✅ Mode Google Sheets aktif. Tambah/edit kegiatan langsung di spreadsheet pada sheet <strong>kegiatan</strong>.
          <a href="${CONFIG.APPS_SCRIPT_URL}" target="_blank" style="margin-left:8px;font-weight:600">Buka Spreadsheet →</a>
        </div>
      </div>`}
      <div class="panel">
        <div class="panel-header"><h3>📋 Data Kegiatan (${data.length})</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Judul</th><th>Tanggal</th><th>Kategori</th><th>Lokasi</th><th>Highlight</th></tr></thead>
            <tbody>${data.map(k=>`<tr>
              <td style="font-weight:600">${k.judul}</td>
              <td>${Fmt.tanggal(k.tanggal)}</td>
              <td><span class="badge badge-green">${k.kategori||'-'}</span></td>
              <td style="color:var(--gray-600);font-size:.85rem">${k.lokasi||'-'}</td>
              <td>${k.highlight ? '<span class="badge badge-gold">✓ Ya</span>' : '<span class="badge badge-gray">Tidak</span>'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  function generateKegiatanCode() {
    const v = id => $(id)?.value || '';
    const hl = $('kg_hl')?.checked;
    const id = Date.now();
    const code = `{
  id: ${id},
  judul: '${v('kg_judul').replace(/'/g,"\\'")}',
  tanggal: '${v('kg_tgl')}',
  lokasi: '${v('kg_lok').replace(/'/g,"\\'")}',
  kategori: '${v('kg_kat')}',
  deskripsi: '${v('kg_desk').replace(/'/g,"\\'").replace(/\n/g,' ')}',
  foto: '${v('kg_foto')}',
  highlight: ${hl},
},`;
    $('kegiatanCode').innerHTML = `
      <div style="font-size:.82rem;color:var(--gray-600);margin-bottom:8px">Salin kode berikut dan tambahkan ke array <code>kegiatan</code> di <code>js/data.js</code>:</div>
      <pre style="background:var(--dark-900);color:#a8ffb0;padding:16px;border-radius:var(--radius);overflow-x:auto;font-size:.8rem;line-height:1.7">${code}</pre>
      <button class="btn btn-sm btn-outline" onclick="navigator.clipboard.writeText(${JSON.stringify(code)}).then(()=>toast('Kode disalin!'))">📋 Salin</button>`;
  }

  // ── BANNER MENDATANG ───────────────────────────────────
  async function renderMendatang() {
    const k = await AnsorData.getKegiatanMendatang();
    content().innerHTML = `
      <div class="section-title">Banner Kegiatan Mendatang</div>
      <div class="section-sub">Banner muncul di bagian atas beranda dan halaman kegiatan.</div>
      <div class="panel">
        <div class="panel-header"><h3>Data Banner Saat Ini</h3></div>
        <div class="panel-body">
          <div style="background:var(--gold-100);border:1px solid var(--gold-500);border-radius:var(--radius);padding:16px;margin-bottom:20px">
            <strong style="color:#8b6e17">${k.aktif ? '✅ Banner aktif' : '⛔ Banner nonaktif'}</strong><br>
            <span style="font-size:.9rem;color:#8b6e17">${k.judul||'—'}</span><br>
            <span style="font-size:.8rem;color:#b08a1a">${Fmt.tanggal(k.tanggal)} · ${k.lokasi||'—'}</span>
          </div>
          <p style="font-size:.875rem;color:var(--gray-600);line-height:1.8">
            ${CONFIG.MODE === 'local'
              ? 'Edit data banner di <code>LOCAL_DATA.kegiatan_mendatang</code> dalam file <code>js/data.js</code>. Ubah <code>aktif: false</code> untuk menyembunyikan banner.'
              : 'Update banner di Google Sheets pada sheet <strong>kegiatan_mendatang</strong>. Ubah kolom <code>aktif</code> ke <code>FALSE</code> untuk menyembunyikan.'}
          </p>
          ${CONFIG.MODE === 'local' ? `
          <details style="margin-top:16px">
            <summary style="font-size:.85rem;font-weight:600;cursor:pointer;color:var(--green-700)">Lihat struktur data</summary>
            <pre style="background:var(--dark-900);color:#a8ffb0;padding:16px;border-radius:var(--radius);margin-top:12px;font-size:.8rem;overflow-x:auto">${JSON.stringify(k, null, 2)}</pre>
          </details>` : ''}
        </div>
      </div>`;
  }

  // ── RANTING ────────────────────────────────────────────
  async function renderRanting() {
    const data = await AnsorData.getRanting();
    content().innerHTML = `
      <div class="section-title">Data Ranting</div>
      <div class="section-sub">${CONFIG.MODE === 'local' ? 'Mode lokal: edit di <code>LOCAL_DATA.ranting</code> dalam <code>js/data.js</code>.' : 'Edit langsung di Google Sheets, sheet <strong>ranting</strong>.'}</div>
      <div class="panel">
        <div class="panel-header">
          <h3>Daftar Ranting (${data.length})</h3>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>ID</th><th>Nama Ranting</th><th>Desa/Kelurahan</th><th>Ketua</th><th>Status</th></tr></thead>
            <tbody>${data.map(r=>`<tr>
              <td style="font-size:.78rem;color:var(--gray-400)">${r.id}</td>
              <td style="font-weight:600">${r.nama}</td>
              <td>${r.desa}</td>
              <td>${r.ketua}</td>
              <td><span class="badge badge-green">✓ Aktif</span></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>
      ${CONFIG.MODE === 'local' ? `
      <div class="panel">
        <div class="panel-header"><h3>📋 Template Ranting Baru</h3></div>
        <div class="panel-body">
          <pre style="background:var(--dark-900);color:#a8ffb0;padding:16px;border-radius:var(--radius);font-size:.8rem;overflow-x:auto">{ id: 'r${String(data.length+1).padStart(2,'0')}', nama: 'PR NamaRanting', desa: 'Desa NamaDesa', ketua: 'Nama Ketua', aktif: true },</pre>
          <div style="font-size:.82rem;color:var(--gray-600);margin-top:8px">Tambahkan ke array <code>ranting</code> di <code>LOCAL_DATA</code> dalam <code>js/data.js</code>.</div>
        </div>
      </div>` : ''}`;
  }

  // ── PENGURUS ───────────────────────────────────────────
  async function renderPengurus() {
    const data = await AnsorData.getPengurusPAC();
    content().innerHTML = `
      <div class="section-title">Pengurus PAC</div>
      <div class="section-sub">${CONFIG.MODE === 'local' ? 'Mode lokal: edit di <code>LOCAL_DATA.pengurus_pac</code> dalam <code>js/data.js</code>.' : 'Edit langsung di Google Sheets, sheet <strong>pengurus_pac</strong>.'}</div>
      <div class="panel">
        <div class="panel-header"><h3>Daftar Pengurus (${data.length})</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>Nama</th><th>Jabatan</th><th>Departemen</th><th>Tipe</th></tr></thead>
            <tbody>${data.map(p=>`<tr>
              <td style="color:var(--gray-400);font-size:.8rem">${p.urutan}</td>
              <td style="font-weight:600">${p.nama}</td>
              <td>${p.jabatan}</td>
              <td><span class="badge badge-gray">${p.departemen||'-'}</span></td>
              <td><span class="badge ${p.tipe==='ketua'?'badge-gold':p.tipe==='dept'?'badge-gray':'badge-green'}">${p.tipe||'-'}</span></td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── PROFIL ─────────────────────────────────────────────
  async function renderProfil() {
    const p = await AnsorData.getProfil();
    content().innerHTML = `
      <div class="section-title">Profil Organisasi</div>
      <div class="section-sub">${CONFIG.MODE === 'local' ? 'Mode lokal: edit di <code>LOCAL_DATA.profil</code> dalam <code>js/data.js</code>.' : 'Edit di Google Sheets, sheet <strong>profil</strong> (format key-value).'}</div>
      <div class="panel">
        <div class="panel-header"><h3>Data Profil Saat Ini</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Key</th><th>Value</th></tr></thead>
            <tbody>${Object.entries(p).map(([k,v])=>`<tr>
              <td style="font-family:monospace;font-size:.82rem;color:var(--gray-400)">${k}</td>
              <td style="font-size:.875rem;word-break:break-all">${Array.isArray(v) ? v.join('; ') : v||'—'}</td>
            </tr>`).join('')}</tbody>
          </table>
        </div>
      </div>`;
  }

  // ── INIT ───────────────────────────────────────────────
  renderDashboard();
  </script>
</body>
</html>
