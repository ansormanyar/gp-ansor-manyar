<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman Tidak Ditemukan | GP Ansor Manyar</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green-900:#0d3d1e; --green-600:#22993f;
      --gold-300:#e8cb6e; --gold-500:#c9a227;
      --white:#fff; --gray-600:#5e6860;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Inter',sans-serif;
      background:linear-gradient(150deg,var(--green-900) 0%,#1c2320 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      text-align:center; padding:24px;
    }
    .wrap { max-width:480px; }
    .code {
      font-family:'Amiri',serif; font-size:6rem; font-weight:700;
      color:var(--gold-300); line-height:1; margin-bottom:16px;
    }
    h1 { font-family:'Amiri',serif; font-size:1.8rem; color:var(--white); margin-bottom:12px; }
    p { color:rgba(255,255,255,.6); font-size:.95rem; line-height:1.75; margin-bottom:32px; }
    .btn {
      display:inline-block; padding:12px 28px;
      background:var(--green-600); color:var(--white);
      font-size:.9rem; font-weight:600; border-radius:8px;
      text-decoration:none; transition:background .2s;
    }
    .btn:hover { background:#1a7a3c; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Halaman Tidak Ditemukan</h1>
    <p>Maaf, halaman yang kamu cari tidak ada atau sudah dipindahkan. Kembali ke beranda GP Ansor Manyar.</p>
    <a href="/gp-ansor-manyar/" class="btn" id="homeBtn">← Kembali ke Beranda</a>
  </div>
  <script>
    // Sesuaikan link beranda otomatis (untuk custom domain atau subdomain)
    const base = location.hostname === 'localhost' ? '/' : '/';
    document.getElementById('homeBtn').href = base;
  </script>
</body>
</html>
