<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pimpinan Ranting — GP Ansor Manyar</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand">
        <img src="../images/logo.png" alt="Logo GP Ansor" class="brand-logo" onerror="this.style.display='none'" />
        <div class="brand-text">
          <span class="brand-name">GP Ansor Manyar</span>
          <span class="brand-sub">PAC Kec. Manyar · Kab. Gresik</span>
        </div>
      </a>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html" class="nav-link">Beranda</a>
        <a href="kegiatan.html" class="nav-link">Kegiatan</a>
        <a href="ranting.html" class="nav-link active">Ranting</a>
        <a href="pengurus.html" class="nav-link">Pengurus PAC</a>
        <a href="tentang.html" class="nav-link">Tentang</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="page-breadcrumb">
        <a href="../index.html">Beranda</a><span>›</span><span>Pimpinan Ranting</span>
      </div>
      <h1 class="page-title">Pimpinan Ranting</h1>
      <p class="page-subtitle">Jaringan GP Ansor Manyar yang hadir di setiap desa dan kelurahan se-Kecamatan Manyar.</p>
    </div>
  </section>

  <section class="section">
    <div class="container">

      <!-- SEARCH -->
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:36px;">
        <p id="rantingCount" style="font-size:.9rem;color:var(--gray-600)">Memuat data...</p>
        <div class="search-wrap">
          <input type="text" id="searchRanting" placeholder="Cari ranting atau desa..." />
        </div>
      </div>

      <!-- GRID RANTING -->
      <div class="ranting-full-grid" id="rantingGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;">
        <!-- skeleton -->
        <div class="skeleton" style="height:140px;border-radius:12px"></div>
        <div class="skeleton" style="height:140px;border-radius:12px"></div>
        <div class="skeleton" style="height:140px;border-radius:12px"></div>
        <div class="skeleton" style="height:140px;border-radius:12px"></div>
      </div>
    </div>
  </section>

  <!-- MODAL DETAIL RANTING -->
  <div class="modal-overlay" id="rantingModal">
    <div class="modal" id="rantingModalContent">
      <div class="modal-header">
        <h3 id="modalRantingName">Detail Ranting</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <div class="ranting-header" id="modalRantingHeader"></div>
        <div class="dept-section">
          <div class="dept-title">Jajaran Pengurus</div>
          <div class="pengurus-grid" id="modalPengurusGrid"></div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-bottom" style="padding:20px 0">
      <div class="container" style="justify-content:center">
        <span>© <span class="year"></span> GP Ansor Manyar</span>
      </div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', scrollY > 40));
    document.getElementById('navToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
    document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());

    let allRanting = [];

    function renderRantingCard(r) {
      return `
        <div class="ranting-full-card" data-id="${r.id}"
          style="background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-md);
                 padding:24px;cursor:pointer;transition:all .2s;"
          onmouseenter="this.style.borderColor='var(--green-600)';this.style.transform='translateY(-3px)';this.style.boxShadow='var(--shadow-md)'"
          onmouseleave="this.style.borderColor='var(--gray-200)';this.style.transform='';this.style.boxShadow=''">
          <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--green-100);
                        color:var(--green-700);display:flex;align-items:center;justify-content:center;
                        font-size:1.4rem;flex-shrink:0">🕌</div>
            <div>
              <div style="font-weight:700;font-size:1rem;color:var(--dark-900)">${r.nama}</div>
              <div style="font-size:.82rem;color:var(--gray-600);margin-top:2px">${r.desa}</div>
            </div>
          </div>
          <div style="padding-top:14px;border-top:1px solid var(--gray-100)">
            <div style="font-size:.78rem;color:var(--gray-400);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;font-weight:600">Ketua</div>
            <div style="font-size:.9rem;font-weight:600;color:var(--dark-800)">${r.ketua}</div>
          </div>
          <div style="margin-top:14px">
            <span style="font-size:.78rem;color:var(--green-600);font-weight:600;
                         background:var(--green-50);padding:4px 10px;border-radius:100px;">
              Lihat Pengurus →
            </span>
          </div>
        </div>`;
    }

    function renderPengurusCard(p) {
      const inisial = (p.nama||'').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const avatar = p.foto ? `<img src="${p.foto}" alt="${p.nama}" style="width:100%;height:100%;object-fit:cover" />` : inisial;
      return `
        <div class="pengurus-card ${p.tipe||''}">
          <div class="pengurus-avatar">${avatar}</div>
          <div class="pengurus-jabatan">${p.jabatan}</div>
          <div class="pengurus-nama">${p.nama}</div>
        </div>`;
    }

    function renderGrid(data) {
      const grid = document.getElementById('rantingGrid');
      document.getElementById('rantingCount').textContent = `Menampilkan ${data.length} ranting aktif`;
      grid.innerHTML = data.length
        ? data.map(renderRantingCard).join('')
        : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">🔍</div><p>Ranting tidak ditemukan.</p></div>`;

      // Attach click
      grid.querySelectorAll('.ranting-full-card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
      });
    }

    async function openModal(id) {
      const r = allRanting.find(x => x.id === id);
      if (!r) return;

      document.getElementById('modalRantingName').textContent = r.nama;
      document.getElementById('modalRantingHeader').innerHTML = `
        <div class="ranting-header-icon">🕌</div>
        <div class="ranting-header-info">
          <h2>${r.nama}</h2>
          <p>${r.desa}</p>
          <div class="ranting-header-meta">
            <span>🧑‍💼 Ketua: ${r.ketua}</span>
            <span>✅ Aktif</span>
          </div>
        </div>`;

      const pg = document.getElementById('modalPengurusGrid');
      pg.innerHTML = '<div class="skeleton" style="height:120px;border-radius:12px"></div>'.repeat(4);

      document.getElementById('rantingModal').classList.add('open');

      const pengurus = await AnsorData.getPengurusRanting(id);
      pg.innerHTML = pengurus.length
        ? pengurus.map(renderPengurusCard).join('')
        : `<p style="color:var(--gray-400);font-size:.9rem;grid-column:1/-1">
             Data pengurus belum diisi. Silakan tambahkan di Google Sheets pada sheet <strong>pengurus_ranting</strong>.
           </p>`;
    }

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('rantingModal').classList.remove('open');
    });
    document.getElementById('rantingModal').addEventListener('click', e => {
      if (e.target === document.getElementById('rantingModal')) {
        document.getElementById('rantingModal').classList.remove('open');
      }
    });

    let searchTimer;
    document.getElementById('searchRanting').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = e.target.value.toLowerCase();
        renderGrid(allRanting.filter(r =>
          r.nama.toLowerCase().includes(q) || r.desa.toLowerCase().includes(q) || r.ketua.toLowerCase().includes(q)
        ));
      }, 300);
    });

    // Hash navigation (dari beranda)
    async function init() {
      allRanting = await AnsorData.getRanting();
      renderGrid(allRanting);
      const hash = location.hash.replace('#', '');
      if (hash) {
        const r = allRanting.find(x => Fmt.slug(x.nama) === hash);
        if (r) setTimeout(() => openModal(r.id), 400);
      }
    }
    init();
  </script>
</body>
</html>
