<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pimpinan Ranting — GP Ansor Manyar</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">
      <img src="../assets/logo.png" alt="Logo GP Ansor" onerror="this.style.display='none'"/>
      <div class="nav-brand-text">
        <strong>GP Ansor Manyar</strong>
        <span>PAC Kec. Manyar · Kab. Gresik</span>
      </div>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="kegiatan.html">Kegiatan</a></li>
      <li><a href="ranting.html" class="active">Ranting</a></li>
      <li><a href="pengurus.html">Pengurus</a></li>
      <li><a href="tentang.html">Tentang</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
  </div>
</nav>

<div class="breadcrumb"><div class="container"><a href="../index.html">Beranda</a><span>›</span> Pimpinan Ranting</div></div>

<div class="page-header">
  <h1>Pimpinan Ranting</h1>
  <p>Jaringan GP Ansor di setiap desa dan kelurahan se-Kecamatan Manyar</p>
</div>

<section class="section">
  <div class="container">
    <div class="ranting-grid" id="rantingList">
      <div class="loading">Memuat data ranting...</div>
    </div>
  </div>
</section>

<footer>
  <p>&copy; <span id="tahun"></span> <strong>GP Ansor Manyar</strong></p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script>
  document.getElementById('navToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
  document.getElementById('tahun').textContent = new Date().getFullYear();

  async function init() {
    try {
      const data    = await DB.getAll();
      const list    = (data.ranting || []).filter(r => r['Status'] !== 'Nonaktif');
      const el      = document.getElementById('rantingList');
      if (!list.length) { el.innerHTML = '<p class="kosong">Belum ada data ranting.</p>'; return; }
      el.innerHTML = list.map(r => `
        <div class="ranting-card">
          <div class="ranting-nama">${r['Nama Ranting']}</div>
          <div class="ranting-desa">📍 ${r['Desa']}</div>
          <div class="ranting-info">
            ${r['Ketua']     ? `<span>👤 Ketua: <strong>${r['Ketua']}</strong></span>` : ''}
            ${r['HP Ketua']  ? `<span>📱 ${r['HP Ketua']}</span>` : ''}
            ${r['Anggota']   ? `<span>👥 ${r['Anggota']} anggota</span>` : ''}
            ${r['Tahun Berdiri'] ? `<span>🗓️ Berdiri ${r['Tahun Berdiri']}</span>` : ''}
            ${r['Keterangan'] ? `<span style="color:var(--abu-3);font-size:.8rem">${r['Keterangan']}</span>` : ''}
          </div>
        </div>`).join('');
    } catch(e) {
      document.getElementById('rantingList').innerHTML = '<p class="kosong">Gagal memuat data.</p>';
    }
  }
  init();
</script>
</body>
</html>
