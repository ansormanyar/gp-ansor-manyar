<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kegiatan — GP Ansor Manyar</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand">
        <img src="../images/logo.png" alt="Logo GP Ansor" class="brand-logo" onerror="this.style.display='none'" />
        <div class="brand-text">
          <span class="brand-name">GP Ansor Manyar</span>
          <span class="brand-sub">PAC Kec. Manyar · Kab. Gresik</span>
        </div>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html" class="nav-link">Beranda</a>
        <a href="kegiatan.html" class="nav-link active">Kegiatan</a>
        <a href="ranting.html" class="nav-link">Ranting</a>
        <a href="pengurus.html" class="nav-link">Pengurus PAC</a>
        <a href="tentang.html" class="nav-link">Tentang</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="page-breadcrumb">
        <a href="../index.html">Beranda</a>
        <span>›</span>
        <span>Kegiatan</span>
      </div>
      <h1 class="page-title">Kegiatan GP Ansor Manyar</h1>
      <p class="page-subtitle">Dokumentasi dan jadwal kegiatan Gerakan Pemuda Ansor Kecamatan Manyar dalam melayani masyarakat.</p>
    </div>
  </section>

  <!-- BANNER MENDATANG -->
  <div id="upcomingBannerWrap"></div>

  <section class="section">
    <div class="container">

      <!-- TOOLBAR -->
      <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:32px;">
        <div class="filter-bar" id="filterBar">
          <button class="filter-btn active" data-kat="semua">Semua</button>
          <button class="filter-btn" data-kat="Keagamaan">Keagamaan</button>
          <button class="filter-btn" data-kat="Sosial">Sosial</button>
          <button class="filter-btn" data-kat="Pelatihan">Pelatihan</button>
          <button class="filter-btn" data-kat="Organisasi">Organisasi</button>
        </div>
        <div class="search-wrap">
          <input type="text" id="searchInput" placeholder="Cari kegiatan..." />
        </div>
      </div>

      <!-- GRID -->
      <div class="kegiatan-grid" id="kegiatanGrid">
        <!-- loading skeleton -->
        <div class="kegiatan-card"><div class="kegiatan-img skeleton" style="height:200px"></div><div class="kegiatan-body"><div class="skeleton" style="height:14px;width:70%;margin-bottom:10px"></div><div class="skeleton" style="height:20px;margin-bottom:8px"></div><div class="skeleton" style="height:14px"></div></div></div>
        <div class="kegiatan-card"><div class="kegiatan-img skeleton" style="height:200px"></div><div class="kegiatan-body"><div class="skeleton" style="height:14px;width:70%;margin-bottom:10px"></div><div class="skeleton" style="height:20px;margin-bottom:8px"></div><div class="skeleton" style="height:14px"></div></div></div>
        <div class="kegiatan-card"><div class="kegiatan-img skeleton" style="height:200px"></div><div class="kegiatan-body"><div class="skeleton" style="height:14px;width:70%;margin-bottom:10px"></div><div class="skeleton" style="height:20px;margin-bottom:8px"></div><div class="skeleton" style="height:14px"></div></div></div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom" style="padding:20px 0">
      <div class="container" style="justify-content:center">
        <span>© <span class="year"></span> GP Ansor Manyar</span>
      </div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    // Navbar
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', scrollY > 40));
    document.getElementById('navToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
    document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());

    const PER_PAGE = 6;
    let allData = [], filtered = [], currentPage = 1, activeKat = 'semua', searchQ = '';

    function renderKategoriIcon(k) {
      return { Keagamaan:'🕌', Sosial:'🤝', Pelatihan:'📚', Organisasi:'🏛️', Olahraga:'⚽' }[k] || '📌';
    }

    function renderCard(k) {
      const foto = k.foto ? `<img src="${k.foto}" alt="${k.judul}" loading="lazy" />` : `<span>${renderKategoriIcon(k.kategori)}</span>`;
      return `<article class="kegiatan-card">
        <div class="kegiatan-img">${foto}</div>
        <div class="kegiatan-body">
          <span class="kegiatan-tag">${k.kategori || 'Kegiatan'}</span>
          <h3 class="kegiatan-title">${k.judul}</h3>
          <p class="kegiatan-desc">${k.deskripsi}</p>
          <div class="kegiatan-meta">
            <span>📅 ${Fmt.tanggal(k.tanggal)}</span>
            <span>📍 ${k.lokasi}</span>
          </div>
        </div>
      </article>`;
    }

    function applyFilter() {
      filtered = allData.filter(k => {
        const katOk = activeKat === 'semua' || k.kategori === activeKat;
        const q = searchQ.toLowerCase();
        const searchOk = !q || k.judul.toLowerCase().includes(q) || k.lokasi.toLowerCase().includes(q) || (k.deskripsi||'').toLowerCase().includes(q);
        return katOk && searchOk;
      });
      currentPage = 1;
      renderPage();
    }

    function renderPage() {
      const grid = document.getElementById('kegiatanGrid');
      const start = (currentPage - 1) * PER_PAGE;
      const slice = filtered.slice(start, start + PER_PAGE);
      grid.innerHTML = slice.length
        ? slice.map(renderCard).join('')
        : `<div class="empty-state" style="grid-column:1/-1"><div class="empty-state-icon">📭</div><p>Tidak ada kegiatan ditemukan.</p></div>`;
      renderPagination();
    }

    function renderPagination() {
      const total = Math.ceil(filtered.length / PER_PAGE);
      const pg = document.getElementById('pagination');
      if (total <= 1) { pg.innerHTML = ''; return; }
      let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
      for (let i = 1; i <= total; i++) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
      pg.innerHTML = html;
    }

    function goPage(p) {
      currentPage = p;
      renderPage();
      window.scrollTo({ top: 300, behavior: 'smooth' });
    }

    // Filter buttons
    document.getElementById('filterBar').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeKat = btn.dataset.kat;
      applyFilter();
    });

    // Search
    let searchTimer;
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => { searchQ = e.target.value; applyFilter(); }, 300);
    });

    // Upcoming banner
    async function renderUpcoming() {
      const k = await AnsorData.getKegiatanMendatang();
      if (!k || !k.aktif) return;
      document.getElementById('upcomingBannerWrap').innerHTML = `
        <div class="upcoming-banner">
          <div class="container">
            <div class="upcoming-inner">
              <div class="upcoming-label">📢 Kegiatan Mendatang</div>
              <div class="upcoming-content">
                <div class="upcoming-info">
                  <div class="upcoming-title">${k.judul}</div>
                  <div class="upcoming-meta">
                    <span>📅 ${Fmt.tanggal(k.tanggal)}${k.waktu?' · '+k.waktu:''}</span>
                    <span>📍 ${k.lokasi}</span>
                  </div>
                </div>
                <div class="upcoming-cta"><a href="${k.link_daftar||'#'}" class="btn btn-gold">${k.teks_tombol||'Selengkapnya'}</a></div>
              </div>
            </div>
          </div>
        </div>`;
    }

    async function init() {
      await renderUpcoming();
      allData = await AnsorData.getKegiatan();
      filtered = allData;
      renderPage();
    }
    init();
  </script>
</body>
</html>
