<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kegiatan — GP Ansor Manyar</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <a href="../index.html" class="nav-brand">
      <img src="../assets/logo.png" alt="Logo GP Ansor" onerror="this.style.display='none'"/>
      <div class="nav-brand-text">
        <strong>GP Ansor Manyar</strong>
        <span>PAC Kec. Manyar · Kab. Gresik</span>
      </div>
    </a>
    <ul class="nav-links" id="navLinks">
      <li><a href="../index.html">Beranda</a></li>
      <li><a href="kegiatan.html" class="active">Kegiatan</a></li>
      <li><a href="ranting.html">Ranting</a></li>
      <li><a href="pengurus.html">Pengurus</a></li>
      <li><a href="tentang.html">Tentang</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<div class="breadcrumb">
  <div class="container">
    <a href="../index.html">Beranda</a><span>›</span> Kegiatan
  </div>
</div>

<div class="page-header">
  <h1>Kegiatan GP Ansor Manyar</h1>
  <p>Dokumentasi dan jadwal kegiatan dalam melayani masyarakat</p>
</div>

<section class="section">
  <div class="container">
    <div class="filter-bar" id="filterBar">
      <button class="filter-btn active" data-kat="Semua">Semua</button>
      <button class="filter-btn" data-kat="Keagamaan">🕌 Keagamaan</button>
      <button class="filter-btn" data-kat="Sosial">🤝 Sosial</button>
      <button class="filter-btn" data-kat="Pelatihan">📚 Pelatihan</button>
      <button class="filter-btn" data-kat="Organisasi">🏛️ Organisasi</button>
    </div>
    <div class="grid-3" id="kegiatanList">
      <div class="loading">Memuat kegiatan...</div>
    </div>
  </div>
</section>

<footer>
  <p>&copy; <span id="tahun"></span> <strong>GP Ansor Manyar</strong> — PAC Kecamatan Manyar, Gresik</p>
</footer>

<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script>
  document.getElementById('navToggle').addEventListener('click', () => {
    document.getElementById('navLinks').classList.toggle('open');
  });
  document.getElementById('tahun').textContent = new Date().getFullYear();

  let semuaKegiatan = [];
  let filterAktif   = 'Semua';

  function fmtTgl(str) {
    if (!str) return '-';
    const d = new Date(str);
    return isNaN(d) ? str : d.toLocaleDateString('id-ID', { day:'numeric', month:'long', year:'numeric' });
  }

  function ikonKategori(kat) {
    const map = { Keagamaan:'🕌', Sosial:'🤝', Pelatihan:'📚', Organisasi:'🏛️' };
    return map[kat] || '📌';
  }

  function render(list) {
    const el = document.getElementById('kegiatanList');
    const filtered = filterAktif === 'Semua' ? list : list.filter(k => k['Kategori'] === filterAktif);
    if (!filtered.length) { el.innerHTML = '<p class="kosong">Belum ada kegiatan untuk kategori ini.</p>'; return; }
    const sorted = [...filtered].sort((a,b) => b['Tanggal'] > a['Tanggal'] ? 1 : -1);
    el.innerHTML = sorted.map(k => `
      <div class="card">
        ${k['Foto']
          ? `<img class="card-img" src="${k['Foto']}" alt="${k['Judul']}" loading="lazy"/>`
          : `<div class="card-img-placeholder">${ikonKategori(k['Kategori'])}</div>`}
        <div class="card-body">
          <span class="card-badge">${k['Kategori'] || 'Umum'}</span>
          <div class="card-title">${k['Judul']}</div>
          <div class="card-meta">
            <span>📅 ${fmtTgl(k['Tanggal'])}</span>
            ${k['Lokasi'] ? `<span>📍 ${k['Lokasi']}</span>` : ''}
          </div>
          ${k['Deskripsi'] ? `<p style="font-size:.85rem;color:var(--abu-3);margin-top:.6rem">${k['Deskripsi']}</p>` : ''}
        </div>
      </div>`).join('');
  }

  // Filter handler
  document.getElementById('filterBar').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterAktif = btn.dataset.kat;
    render(semuaKegiatan);
  });

  async function init() {
    try {
      const data = await DB.getAll();
      semuaKegiatan = data.kegiatan || [];
      render(semuaKegiatan);
    } catch(e) {
      document.getElementById('kegiatanList').innerHTML = '<p class="kosong">Gagal memuat data.</p>';
    }
  }

  init();
</script>
</body>
</html>
