<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pengurus PAC — GP Ansor Manyar</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header class="navbar" id="navbar">
    <div class="container navbar-inner">
      <a href="../index.html" class="brand">
        <img src="../images/logo.png" alt="Logo GP Ansor" class="brand-logo" onerror="this.style.display='none'" />
        <div class="brand-text">
          <span class="brand-name">GP Ansor Manyar</span>
          <span class="brand-sub">PAC Kec. Manyar · Kab. Gresik</span>
        </div>
      </a>
      <button class="nav-toggle" id="navToggle"><span></span><span></span><span></span></button>
      <nav class="nav-links" id="navLinks">
        <a href="../index.html" class="nav-link">Beranda</a>
        <a href="kegiatan.html" class="nav-link">Kegiatan</a>
        <a href="ranting.html" class="nav-link">Ranting</a>
        <a href="pengurus.html" class="nav-link active">Pengurus PAC</a>
        <a href="tentang.html" class="nav-link">Tentang</a>
      </nav>
    </div>
  </header>

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="page-breadcrumb">
        <a href="../index.html">Beranda</a><span>›</span><span>Pengurus PAC</span>
      </div>
      <h1 class="page-title">Pengurus PAC GP Ansor Manyar</h1>
      <p class="page-subtitle" id="heroSubtitle">Struktur kepengurusan Pimpinan Anak Cabang GP Ansor Kecamatan Manyar.</p>
    </div>
  </section>

  <section class="section">
    <div class="container" id="pengurusContainer">
      <!-- rendered by JS -->
      <div class="skeleton" style="height:32px;width:240px;border-radius:8px;margin-bottom:24px"></div>
      <div class="pengurus-grid">
        <div class="skeleton" style="height:200px;border-radius:12px"></div>
        <div class="skeleton" style="height:200px;border-radius:12px"></div>
        <div class="skeleton" style="height:200px;border-radius:12px"></div>
        <div class="skeleton" style="height:200px;border-radius:12px"></div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-bottom" style="padding:20px 0">
      <div class="container" style="justify-content:center">
        <span>© <span class="year"></span> GP Ansor Manyar</span>
      </div>
    </div>
  </footer>

  <script src="../js/config.js"></script>
  <script src="../js/data.js"></script>
  <script>
    window.addEventListener('scroll', () => document.getElementById('navbar').classList.toggle('scrolled', scrollY > 40));
    document.getElementById('navToggle').addEventListener('click', () => document.getElementById('navLinks').classList.toggle('open'));
    document.querySelectorAll('.year').forEach(el => el.textContent = new Date().getFullYear());

    const DEPT_ICON = {
      'Pimpinan Inti': '⭐',
      'Kaderisasi': '🎓',
      'Keagamaan': '🕌',
      'Sosial': '🤝',
      'Media & Komunikasi': '📡',
      'Hukum & Advokasi': '⚖️',
      'Ekonomi': '💼',
      'Olahraga & Seni': '⚽',
    };

    function renderPengurusCard(p) {
      const inisial = (p.nama||'').split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();
      const avatar = p.foto
        ? `<img src="${p.foto}" alt="${p.nama}" style="width:100%;height:100%;object-fit:cover" />`
        : inisial;
      const borderColor = { ketua:'var(--gold-500)', wk:'var(--green-600)', sekret:'#3b82f6', bendahara:'#8b5cf6' }[p.tipe] || 'var(--gray-200)';
      return `
        <div class="pengurus-card ${p.tipe||''}" style="border-top-color:${borderColor}">
          <div class="pengurus-avatar">${avatar}</div>
          <div class="pengurus-jabatan">${p.jabatan}</div>
          <div class="pengurus-nama">${p.nama}</div>
        </div>`;
    }

    async function init() {
      const [profil, pengurus] = await Promise.all([AnsorData.getProfil(), AnsorData.getPengurusPAC()]);

      if (profil.periode) {
        document.getElementById('heroSubtitle').textContent =
          `Struktur kepengurusan Pimpinan Anak Cabang GP Ansor Kecamatan Manyar periode ${profil.periode}.`;
      }

      // Kelompokkan per departemen
      const deptMap = {};
      pengurus.forEach(p => {
        const dept = p.departemen || 'Lainnya';
        if (!deptMap[dept]) deptMap[dept] = [];
        deptMap[dept].push(p);
      });

      // Urutan departemen
      const order = ['Pimpinan Inti', 'Kaderisasi', 'Keagamaan', 'Sosial', 'Media & Komunikasi', 'Hukum & Advokasi', 'Ekonomi', 'Olahraga & Seni', 'Lainnya'];
      const sorted = [...new Set([...order, ...Object.keys(deptMap)])].filter(d => deptMap[d]);

      const container = document.getElementById('pengurusContainer');
      container.innerHTML = sorted.map(dept => `
        <div class="dept-section">
          <div class="dept-title">${DEPT_ICON[dept] || '🏛️'} ${dept}</div>
          <div class="pengurus-grid">${deptMap[dept].map(renderPengurusCard).join('')}</div>
        </div>`).join('');
    }
    init();
  </script>
</body>
</html>
